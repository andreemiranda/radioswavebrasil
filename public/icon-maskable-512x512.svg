    <rect x="150" y="180" width="16" height="152" rx="8" fill="url(#wave_grad)" opacity="0.8"/>
    <rect x="180" y="140" width="16" height="232" rx="8" fill="url(#wave_grad)"/>
    <rect x="210" y="100" width="16" height="312" rx="8" fill="url(#wave_grad)"/>
    <rect x="240" y="160" width="16" height="192" rx="8" fill="url(#wave_grad)"/>
    <rect x="270" y="120" width="16" height="272" rx="8" fill="url(#wave_grad)"/>
    <rect x="300" y="190" width="16" height="132" rx="8" fill="url(#wave_grad)" opacity="0.8"/>
    <rect x="330" y="230" width="16" height="52" rx="8" fill="url(#wave_grad)" opacity="0.6"/>
