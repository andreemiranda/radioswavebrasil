<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#009C3B"/>
      <stop offset="100%" style="stop-color:#002776"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FFDF00"/>
      <stop offset="100%" style="stop-color:#009C3B"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  
  <!-- Decorative Waves -->
  <g opacity="0.1">
    <path d="M0 315 Q 300 100 600 315 T 1200 315" stroke="white" stroke-width="2" fill="none"/>
    <path d="M0 365 Q 300 150 600 365 T 1200 365" stroke="white" stroke-width="2" fill="none"/>
    <path d="M0 265 Q 300 50 600 265 T 1200 265" stroke="white" stroke-width="2" fill="none"/>
  </g>

   <!-- Large Radio Icon -->
  <g transform="translate(100, 165) scale(8)" opacity="0.15">
    <rect width="32" height="32" rx="8" fill="#FFDF00"/>
    <path d="M4.9 19.1C1 15.2 1 8.8 4.9 4.9 M7.8 16.2c-2.3-2.3-2.3-6.1 0-8.5 M12 12 a2 2 0 1 0 4 0 a2 2 0 1 0 -4 0 M16.2 7.8c2.3 2.3 2.3 6.1 0 8.5 M19.1 4.9C23 8.8 23 15.2 19.1 19.1" stroke="#009C3B" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- Content -->
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur in="SourceAlpha" stdDeviation="4" />
    <feOffset dx="0" dy="4" />
    <feComponentTransfer>
      <feFuncA type="linear" slope="0.5" />
    </feComponentTransfer>
    <feMerge>
      <feMergeNode />
      <feMergeNode in="SourceGraphic" />
    </feMerge>
  </filter>

  <text x="600" y="300" text-anchor="middle" font-family="Outfit, Inter, sans-serif" font-weight="900" font-size="96" fill="white" filter="url(#shadow)">
    Radio Wave Brasil
  </text>
  <text x="600" y="390" text-anchor="middle" font-family="Inter, sans-serif" font-weight="600" font-size="36" fill="#FFDF00" filter="url(#shadow)">
    Ouça as melhores rádios brasileiras ao vivo
  </text>

  <!-- Brazil Flag Badge (Simple) -->
  <g transform="translate(1100, 530) scale(0.1)">
    <rect width="720" height="504" fill="#009b3a" />
    <path fill="#fedf00" d="m360 43.2 316.8 208.8L360 460.8 43.2 252z" />
    <circle fill="#0431af" cx="360" cy="252" r="100.8" />
  </g>
</svg>
